<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página não encontrada - Projeto ARCA</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0; padding: 0; box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif; background: #f4f7fb; color: #1a2b4a;
        }

        .pag-erro {
            display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px;
        }

        .erro-card {
            background: #fff; border-radius: 14px; border: 1px solid #e9eef5; padding: 40px; max-width: 500px; width: 100%; text-align: center;
        }

        .titulo-erro {
            font-size: 28px; font-weight: 600; color: #e55a5a; margin-bottom: 16px;
        }

        .mensagem-erro {
            font-size: 16px; color: #666; margin-bottom: 30px; line-height: 1.5;
        }

        .botao-voltar {
            background: #1a56db; color: #fff; border: none; padding: 12px 30px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; text-decoration: none; display: inline-block;
        }

        .botao-voltar:hover {
            background: #1449c1;
        }

        @media (max-width: 480px) {
            .erro-card {
                padding: 28px 18px;
            }
            .titulo-erro {
                font-size: 22px;
            }
            .mensagem-erro {
                font-size: 14px;
            }
        }
    </style>
</head>
<body>
    <div class="pag-erro">
        <div class="erro-card">
            <h1 class="titulo-erro">Oops... Nada por aqui</h1>
            <p class="mensagem-erro">
                Esta página ainda não está disponível. Que tal explorar outra área?
            </p>
            <a href="javascript:history.back()" class="botao-voltar">← Voltar</a>
        </div>
    </div>
</body>
</html>
