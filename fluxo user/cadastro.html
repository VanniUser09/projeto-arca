<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Projeto Arca</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { 
            margin: 0; padding: 0; box-sizing: border-box; 
        }

        body { 
            font-family: 'Poppins', sans-serif; background: #f4f7fb; color: #1a2b4a; 
        }

        .pag-cadastro { 
            display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; 
        }

        .cadastro-card { 
            background: #fff; border-radius: 14px; border: 1px solid #e9eef5; padding: 40px; max-width: 500px; width: 100%; 
        }

        .logo-section { 
            display: flex; align-items: center; gap: 16px; margin-bottom: 30px; justify-content: center; 
        }

        .logo-icon img { 
            max-width: 250px; height: auto; 
        }

        .conteudo-cadastro { 
            text-align: center; margin-bottom: 30px; 
        }

        .conteudo-cadastro h2 { 
            font-size: 24px; margin-bottom: 8px; color: #0b1d5a; 
        }

        .conteudo-cadastro p { 
            font-size: 14px; color: #666; 
        }

        .form-group { 
            display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; 
        }

        label { 
            font-size: 12px; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: 0.5px; 
        }

        input, select { 
            padding: 10px 14px; border: 1px solid #e9eef5; border-radius: 8px; font-family: inherit; font-size: 13px; outline: none; 
        }

        input:focus, select:focus { 
            border-color: #1a56db; box-shadow: 0 0 0 3px rgba(26,86,219,0.08); 
        }

        .botao-salvar { 
            width: 100%; background: #1a56db; color: #fff; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 14px; 
        }

        .botao-cancelar {
            width: 100%; background: #fff; color: #666; border: 1px solid #e9eef5; padding: 12px; border-radius: 8px; cursor: pointer; margin-top: 8px; font-weight: 500;
        }

        @media (max-width: 480px) {
            .cadastro-card {
                padding: 24px 16px;
            }
            .conteudo-cadastro h2 {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="pag-cadastro">
        <div class="cadastro-card">
            <div class="logo-section">
                <div class="logo-icon">
                    <img src="../elementos UIUX/image 42.png" alt="Logo Arca">
                </div>
            </div>
            <div class="conteudo-cadastro">
                <h2>Complete seu Cadastro</h2>
                <p>Informações do Responsável</p>
            </div>

            <form id="formularioCadastro">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="nomeCompleto" placeholder="Digite seu nome" required>
                </div>

                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="email" placeholder="Seu melhor e-mail" required>
                </div>

                <div class="form-group">
                    <label>Telefone</label>
                    <input type="tel" id="telefone" placeholder="(XX) XXXXX-XXXX" required>
                </div>

                <div class="form-group">
                    <label>Endereço</label>
                    <input type="text" id="endereco" placeholder="Rua, número e complemento" required>
                </div>

                <div class="form-group">
                    <label>Cidade</label>
                    <input type="text" id="cidade" placeholder="Sua cidade" required>
                </div>

                <div class="form-group">
                    <label>CPF</label>
                    <input type="text" id="cpf" placeholder="XXX.XXX.XXX-XX" required>
                </div>

                <button type="submit" class="botao-salvar">Salvar Cadastro</button>
                <button type="button" class="botao-cancelar" id="btnCancelar">Cancelar</button>
            </form>
        </div>
    </div>

    <script>
        const formulario = document.getElementById('formularioCadastro');
        const btnCancelar = document.getElementById('btnCancelar');

        formulario.addEventListener('submit', function(e) {
            e.preventDefault();
            window.location.href = './sucesso.html';
        });

        btnCancelar.addEventListener('click', function(e) {
            e.preventDefault();
            window.location.href = '../fluxo user/homeuser1.html';
        });
    </script>
</body>
</html>
